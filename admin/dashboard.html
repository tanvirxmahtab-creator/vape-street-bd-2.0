<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Catalog admin | Vape Street BD</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/brand-refresh.css?v=20260932"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><header class="admin-header"><a class="brand" href="../index.html">VAPE STREET <span>BD</span></a><div><span id="admin-email"></span><button id="logout" class="button button--outline">Log out</button></div></header><main class="admin-main"><div class="admin-title"><div><p class="eyebrow">Catalog administration</p><h1>Products</h1></div><button class="button button--primary" id="new-product">Add product</button></div><section class="admin-list"><div id="admin-status" class="form-message" aria-live="polite"></div><div id="product-list"></div></section><section class="admin-editor" id="product-editor" hidden><div class="editor-head"><h2 id="editor-title">Add product</h2><button class="icon-button" id="close-editor" aria-label="Close editor">&#215;</button></div><form id="product-form"><input type="hidden" id="product-id"><div class="form-grid"><label>Name<input required id="name" maxlength="120"></label><label>Category<select required id="category"><option>Disposables</option><option>Pod Systems &amp; Kits</option><option>E-Liquids</option><option>Mods &amp; Tanks</option><option>Coils &amp; Accessories</option></select></label><label>Price (BDT)<input required id="price" type="number" min="0" step="1"></label><label>Stock status<select id="stock"><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select></label><label>Short specification<input id="short-spec" maxlength="120" placeholder="e.g. 30 ml | 35 mg"></label><label>Product image path or link<input id="image-url" type="text" inputmode="url" maxlength="500" placeholder="/assets/products/device.jpg"><span class="label-note">Paste a product image link, or a Hostinger image path</span></label></div><label>Description<textarea required id="description" rows="4"></textarea></label><label>Variants <span class="label-note">Separate flavor, color, or strength options with commas</span><input id="variants" placeholder="Blueberry Ice, Mint, 50 mg"></label><label class="checkbox-label"><input id="featured" type="checkbox"> Feature this product on the homepage</label><label class="checkbox-label"><input id="remove-image" type="checkbox"> Remove the current product image</label><div class="editor-actions"><button class="button button--primary" type="submit">Save product</button><button class="button button--outline" type="button" id="cancel-edit">Cancel</button></div><p id="save-message" class="form-message" aria-live="polite"></p></form></section></main><script type="module" src="../js/dashboard.js?v=20260932"></script></body></html>
